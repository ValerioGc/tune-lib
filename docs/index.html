<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-5sbkQF1YQeMD3DH5nt+f9pKUPUKnVZj8WxU8XMIPA2Q='; style-src 'self'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'self'; form-action 'none'; object-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TuneLib - Audio library manager for Windows and Linux</title>
    <meta name="description" content="Open source desktop application for managing a library of audio files: metadata editing, cover art, multiple views and a built-in player. Runs entirely on your own computer, with no connection and no telemetry.">
    <link rel="icon" href="./logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <link rel="alternate" hreflang="it" href="./it/">
    <link rel="alternate" hreflang="en" href="./en/">
    <link rel="alternate" hreflang="fr" href="./fr/">
    <link rel="alternate" hreflang="es" href="./es/">
    <link rel="alternate" hreflang="de" href="./de/">
    <link rel="alternate" hreflang="x-default" href="./en/">
    <script>
      // The visitor lands on their own language when the browser asks for one we publish,
      // and on the default language otherwise.
      (function () {
        var supported = ['it', 'en', 'fr', 'es', 'de'];
        var preferences =
          navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language];
        var target = 'en';

        for (var index = 0; index < preferences.length; index += 1) {
          var language = String(preferences[index] || '')
            .split('-')[0]
            .toLowerCase();

          if (supported.indexOf(language) !== -1) {
            target = language;
            break;
          }
        }

        window.location.replace('./' + target + '/');
      })();
    </script>
  </head>
  <body>
    <main class="locale_gate" aria-labelledby="language-title">
      <a class="brand" href="./en/" aria-label="TuneLib">
        <span class="brand_mark" aria-hidden="true"><img src="./logo.svg" alt=""></span>
        <span>TuneLib</span>
      </a>
      <section>
        <p class="eyebrow">Choose your language</p>
        <h1 id="language-title">TuneLib</h1>
        <div class="language_grid">
        <a href="./it/" lang="it" hreflang="it">Italiano</a>
       <a href="./en/" lang="en" hreflang="en">English</a>
       <a href="./fr/" lang="fr" hreflang="fr">Français</a>
       <a href="./es/" lang="es" hreflang="es">Español</a>
       <a href="./de/" lang="de" hreflang="de">Deutsch</a>
        </div>
      </section>
    </main>
  </body>
</html>
