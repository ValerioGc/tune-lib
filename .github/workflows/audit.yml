name: Audit

# Advisories are published on their own timetable, not on ours: a check that only runs
# when a release is cut would learn about a vulnerability weeks after everybody else. So
# this runs weekly on its own, and the release pipeline calls it as a gate.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: 22.14.0

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # `high` rather than `moderate`: most of what is installed here is build tooling that
      # never reaches a user, and a check nobody can keep green is a check nobody reads.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      # Installed rather than run through an action: this is the job whose whole purpose is
      # to be trustworthy, so it borrows as little as possible from elsewhere. The cache
      # above keeps the build off the critical path after the first run.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Every crate listed here is compiled into the shipped binary, so an advisory on one
      # of them is an advisory on the app.
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
