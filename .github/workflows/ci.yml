name: CI

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0
  APP_NAME: TuneLib

jobs:
  # ── Gate: the whole quality chain must pass before any release job runs ───────
  test:
    name: Test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run Rust format check
        run: npm run format:rust:check

      - name: Run Rust clippy
        run: npm run lint:rust

      - name: Check compiled window command permissions
        run: node scripts/check-capabilities.cjs

      # Both suites run with coverage: the thresholds are part of the gate, not a report.
      - name: Run frontend tests with coverage
        run: npm run test:coverage

      # The browser scenarios drive the real frontend, so they need a browser of their own:
      # only Chromium, which is the one the hooks launch.
      - name: Install the Playwright browser
        run: npx playwright install chromium

      - name: Run browser scenarios
        run: npm run test:e2e

      - name: Run Rust tests
        run: npm run test:rust

      - name: Run Rust coverage
        run: npm run coverage:rust

      - name: Check GitHub Pages output
        run: npm run check:pages

      - name: Run frontend build
        run: npm run build

  # ── Gate: nothing ships on top of a dependency with a known advisory ─────────
  audit:
    name: Audit
    uses: ./.github/workflows/audit.yml

  # ── After the gate ───────────────────────────────────────────────────────────
  verify-release:
    name: Verify release
    needs: [test, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${GITHUB_REF_NAME}" =~ ${semver_regex} ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a valid release tag."
            echo "Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, e.g. v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

      - name: Verify tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} must point to a commit already reachable from main."
            exit 1
          fi

      - name: Verify release version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          tauri_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          echo "Tag version:             $tag_version"
          echo "package.json version:    $pkg_version"
          echo "tauri.conf.json version: $tauri_version"
          echo "Cargo.toml version:      $cargo_version"

          for name in pkg tauri cargo; do
            eval "value=\$${name}_version"
            if [[ "$tag_version" != "$value" ]]; then
              echo "Tag version does not match the $name version."
              exit 1
            fi
          done

      - name: Verify changelog has an entry for this version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/extract-changelog.cjs "${GITHUB_REF_NAME#v}"

  build-windows:
    name: Build Windows installer
    needs: verify-release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows installer bundles
        run: npm run tauri build

      - name: Collect Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$nsis) { Write-Error "No NSIS .exe installer found."; exit 1 }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item $nsis.FullName "release-assets/$($env:APP_NAME)_${version}_windows_x64.exe" -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installers
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Build Linux packages
    needs: verify-release
    # Pinned rather than ubuntu-latest: the AppImage links against the glibc of the
    # runner, so a newer one would refuse to start on older distributions.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf build-essential libssl-dev curl wget file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npm run tauri build

      - name: Collect Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"

          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          if [[ -z "$appimage" ]]; then echo "No .AppImage found."; exit 1; fi
          cp "$appimage" "release-assets/${APP_NAME}_${version}_linux_x64_portable.AppImage"

          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n 1)
          if [[ -z "$deb" ]]; then echo "No .deb found."; exit 1; fi
          cp "$deb" "release-assets/${APP_NAME}_${version}_linux_x64.deb"

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installers
          path: release-assets/*
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installers
          path: release-assets

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-installers
          path: release-assets

      - name: Compute combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# TuneLib ${GITHUB_REF_NAME}"
            echo
            node scripts/extract-changelog.cjs "${GITHUB_REF_NAME#v}"
            echo
            echo "## Checksums (SHA-256)"
            echo
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: TuneLib ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
