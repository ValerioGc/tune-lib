sonar.projectKey=tune-lib
sonar.projectName=TuneLib
sonar.projectVersion=1.0.0

# Analyzed sources and test code
sonar.sources=src,src-tauri/src
sonar.tests=src/tests,tests/backend
sonar.test.inclusions=src/tests/**/*.spec.ts,src/tests/**/*.feature,tests/backend/**/*.rs
sonar.exclusions=src/tests/**,**/node_modules/**,**/dist/**,**/coverage/**,src-tauri/target/**,src-tauri/gen/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts,**/*.spec.ts,**/*.d.ts,src-tauri/src/main.rs,src-tauri/src/lib.rs

# Rust: report produced by `cargo llvm-cov --lcov`
sonar.rust.lcov.reportPaths=src-tauri/coverage/lcov.info
sonar.rust.clippy.reportPaths=src-tauri/clippy-report.json
