[package]
name = "tune-lib"
version = "1.0.0"
description = "Audio library manager with metadata editing and an integrated player."
authors = ["tune-lib"]
edition = "2021"
rust-version = "1.85"

[lib]
# Must differ from the binary name: on Windows the two targets cannot share it.
name = "media_audio_lib_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-store = "2"
lofty = "0.25"
base64 = "0.23.1"
http-range = "0.1.5"
percent-encoding = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-autostart = "2.5.1"

[profile.release]
codegen-units = 1
lto = true
# Speed rather than size. What this app spends its time on is parsing tags and moving bytes
# off the disk, both of which the optimiser helps with; the megabytes it costs an installer
# nobody downloads twice are the cheaper side of the trade.
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.4"
